name: Deploy to GitHub Pages

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Error: This workflow can only be run on the main branch."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Ruby and AsciiDoctor w/ rouge
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Build
        run: |
          mkdir -p _build/html
          bundle exec asciidoctor -a toc="left" -a toclevels=2 -a docinfo=private-head README.adoc -o _build/html/index.html

      - name: Upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: _build/html

      - name: Deploy the content to GitHub Pages
        uses: actions/deploy-pages@v5
